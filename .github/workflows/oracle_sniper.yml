name: Oracle Cloud Capacity Sniper

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  hunt:
    runs-on: ubuntu-latest
    steps:
      - name: Setup OCI CLI
        run: |
          bash -c "$(curl -L https://raw.githubusercontent.com/oracle/oci-cli/master/scripts/install/install.sh)" -- --accept-all-defaults
          echo "/home/runner/bin" >> $GITHUB_PATH

      - name: Configure OCI CLI
        env:
          OCI_USER: ${{ secrets.OCI_USER_OCID }}
          OCI_TENANCY: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
          OCI_KEY: ${{ secrets.OCI_KEY_FILE }}
        run: |
          mkdir -p /home/runner/.oci
          echo "$OCI_KEY" | base64 -d > /home/runner/.oci/oci_api_key.pem
          chmod 600 /home/runner/.oci/oci_api_key.pem

          cat <<EOF > /home/runner/.oci/config
          [DEFAULT]
          user=$OCI_USER
          fingerprint=$OCI_FINGERPRINT
          key_file=/home/runner/.oci/oci_api_key.pem
          tenancy=$OCI_TENANCY
          region=$OCI_REGION
          EOF
          chmod 600 /home/runner/.oci/config

      - name: Direct Compute Instance Sniper & Telegram Alert
        env:
          TENANCY_ID: ${{ secrets.OCI_TENANCY_OCID }}
          SUBNET_ID: ${{ secrets.OCI_SUBNET_ID }}
          TELE_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELE_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_TOKEN: ${{ github.token }}
          SUPPRESS_LABEL_WARNING: "True"
          OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING: "True"
        run: |
          # Tao SSH Key tam de gan vao VM
          ssh-keygen -t rsa -b 2048 -N "" -f /home/runner/.oci/id_rsa

          END_TIME=$((SECONDS + 1500))

          while [ $SECONDS -lt $END_TIME ]; do
            echo "--- [$(date '+%H:%M:%S')] Gui lenh tao VM ARM (4 OCPU, 24GB RAM)... ---"

            RESPONSE=$(oci compute instance launch \
              --config-file /home/runner/.oci/config \
              --availability-domain "lBcf:AP-SINGAPORE-1-AD-1" \
              --compartment-id "$TENANCY_ID" \
              --shape "VM.Standard.A1.Flex" \
              --shape-config '{"ocpus":4,"memoryInGBs":24}' \
              --image-id "ocid1.image.oc1.ap-singapore-1.aaaaaaaaxvfsj3bvzatjfbtulypvtqjavwbdgmxdrz4tn3nc7xrsvcfejoka" \
              --subnet-id "$SUBNET_ID" \
              --assign-public-ip true \
              --display-name "Oracle-ARM-Instance" \
              --ssh-authorized-keys-file "/home/runner/.oci/id_rsa.pub" \
              2>&1 || true)

            INSTANCE_ID=$(echo "$RESPONSE" | jq -r '.data.id // empty' 2>/dev/null || true)

            if [ -n "$INSTANCE_ID" ]; then
              echo "===================================================="
              echo ">>> THANH CONG! May ao ARM da tao thanh cong! <<<"
              echo "Instance ID: $INSTANCE_ID"
              echo "===================================================="

              MSG="🚀 *CHUC MUNG! May ao Oracle Cloud ARM da tao thanh cong!*%0A%0A*Region:* ap-singapore-1%0A*Instance ID:* \`$INSTANCE_ID\`%0A*Thoi gian:* $(date '+%Y-%m-%d %H:%M:%S')%0A%0A👉 Vao Oracle Console kiem tra Public IP!"
              curl -s -X POST "https://api.telegram.org/bot${TELE_TOKEN}/sendMessage" \
                -d "chat_id=${TELE_CHAT_ID}" \
                -d "text=${MSG}" \
                -d "parse_mode=Markdown"

              curl -s -X POST "https://api.telegram.org/bot${TELE_TOKEN}/sendDocument" \
                -F "chat_id=${TELE_CHAT_ID}" \
                -F "document=@/home/runner/.oci/id_rsa" \
                -F "caption=🔑 Private Key SSH dang nhap may ao (User: ubuntu)"

              gh workflow disable "oracle_sniper.yml" --repo "${{ github.repository }}" || true
              exit 0
            else
              if echo "$RESPONSE" | grep -qi "Out of host capacity"; then
                echo "Singapore van het slot (Out of host capacity). Cho 15s thu lai..."
              else
                echo ">>> CHI TIET PHAN HOI TU ORACLE <<<"
                echo "$RESPONSE"
                echo "-------------------------------------"
              fi
            fi

            sleep 15
          done
