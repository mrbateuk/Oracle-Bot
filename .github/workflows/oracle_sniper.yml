name: Oracle Cloud Capacity Sniper

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  hunt:
    runs-on: ubuntu-latest
    steps:
      - name: Setup OCI CLI
        run: |
          bash -c "$(curl -L https://raw.githubusercontent.com/oracle/oci-cli/master/scripts/install/install.sh)" -- --accept-all-defaults
          echo "/home/runner/bin" >> $GITHUB_PATH

      - name: Configure OCI CLI
        env:
          OCI_USER: ${{ secrets.OCI_USER_OCID }}
          OCI_TENANCY: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
          OCI_KEY: ${{ secrets.OCI_KEY_FILE }}
        run: |
          mkdir -p /home/runner/.oci
          echo "$OCI_KEY" | base64 -d > /home/runner/.oci/oci_api_key.pem
          chmod 600 /home/runner/.oci/oci_api_key.pem

          cat <<EOF > /home/runner/.oci/config
          [DEFAULT]
          user=$OCI_USER
          fingerprint=$OCI_FINGERPRINT
          key_file=/home/runner/.oci/oci_api_key.pem
          tenancy=$OCI_TENANCY
          region=$OCI_REGION
          EOF
          chmod 600 /home/runner/.oci/config

      - name: Run Stack Apply Job & Alert Telegram
        env:
          STACK_ID: ${{ secrets.OCI_STACK_ID }}
          TELE_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELE_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_TOKEN: ${{ github.token }}
          SUPPRESS_LABEL_WARNING: "True"
          OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING: "True"
        run: |
          echo "=== Kiem tra xac thuc ban dau voi Oracle ==="
          oci os ns get --config-file /home/runner/.oci/config || { echo "LOI XAC THUC OCI! Kiem tra lai Key/Fingerprint."; exit 1; }

          END_TIME=$((SECONDS + 1500))

          while [ $SECONDS -lt $END_TIME ]; do
            echo "--- [$(date '+%H:%M:%S')] Dang gui yeu cau tao may ao ARM... ---"

            oci resource-manager job create-apply-job \
              --config-file /home/runner/.oci/config \
              --stack-id "$STACK_ID" \
              --execution-plan-strategy AUTO_APPROVED \
              --output json > job_output.json 2> job_error.log || true

            JOB_ID=$(jq -r '.data.id // empty' job_output.json 2>/dev/null || true)

            if [ -n "$JOB_ID" ]; then
              echo "Da tao Job kiem tra: $JOB_ID"
              while true; do
                STATUS=$(oci resource-manager job get --config-file /home/runner/.oci/config --job-id "$JOB_ID" --query "data.\"lifecycle-state\"" --raw-output 2>/dev/null || true)
                if [ "$STATUS" = "SUCCEEDED" ]; then
                  echo "===================================================="
                  echo ">>> THANH CONG! May ao da duoc tao hoan tat. <<<"
                  echo "===================================================="

                  MSG="🚀 *CHUC MUNG! May ao Oracle Cloud ARM da tao thanh cong!*%0A%0A*Region:* ap-singapore-1%0A*Job ID:* \`$JOB_ID\`%0A*Thoi gian:* $(date '+%Y-%m-%d %H:%M:%S')%0A%0A👉 Vao Oracle Console kiem tra Public IP!"
                  curl -s -X POST "https://api.telegram.org/bot${TELE_TOKEN}/sendMessage" \
                    -d "chat_id=${TELE_CHAT_ID}" \
                    -d "text=${MSG}" \
                    -d "parse_mode=Markdown"

                  gh workflow disable "oracle_sniper.yml" --repo "${{ github.repository }}" || true
                  exit 0
                elif [ "$STATUS" = "FAILED" ]; then
                  echo "Cum Singapore van het cho (Out of capacity). Nghi 120s de tranh bi chan API..."
                  break
                fi
                sleep 15
              done
            else
              echo ">>> Ghi nhan phan hoi tu Oracle <<<"
              cat job_error.log
              cat job_output.json
              echo "Tam nghi 120s de giam tai yeu cau..."
            fi
            sleep 120
          done
