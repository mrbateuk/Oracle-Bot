name: Oracle Cloud Capacity Sniper

on:
  schedule:
    - cron: '*/30 * * * *'  # Tự động chạy mỗi 30 phút
  workflow_dispatch:       # Nút bấm chạy kiểm tra thủ công ngay lập tức

jobs:
  hunt:
    runs-on: ubuntu-latest
    steps:
      - name: Setup OCI CLI
        run: |
          bash -c "$(curl -L https://raw.githubusercontent.com/oracle/oci-cli/master/scripts/install/install.sh)" -- --accept-all-defaults
          echo "/home/runner/bin" >> $GITHUB_PATH

      - name: Configure OCI CLI
        env:
          OCI_USER: ${{ secrets.OCI_USER_OCID }}
          OCI_TENANCY: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
          OCI_KEY: ${{ secrets.OCI_KEY_FILE }}
        run: |
          mkdir -p ~/.oci
          echo "$OCI_KEY" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem
          cat <<EOF > ~/.oci/config
          [DEFAULT]
          user=$OCI_USER
          fingerprint=$OCI_FINGERPRINT
          key_file=~/.oci/oci_api_key.pem
          tenancy=$OCI_TENANCY
          region=$OCI_REGION
          EOF

      - name: Run Stack Apply Job & Alert Telegram
        env:
          STACK_ID: ${{ secrets.OCI_STACK_ID }}
          TELE_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELE_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_TOKEN: ${{ github.token }}
        run: |
          END_TIME=$((SECONDS + 1500)) # Quét liên tục 25 phút trong mỗi lượt chạy

          while [ $SECONDS -lt $END_TIME ]; do
            echo "--- [$(date '+%H:%M:%S')] Đang gửi yêu cầu tạo máy ảo ARM... ---"
            JOB_ID=$(oci resource-manager job create-apply-job --stack-id "$STACK_ID" --execution-plan-strategy AUTO_APPROVED --query "data.id" --raw-output 2>/dev/null || true)

            if [ -n "$JOB_ID" ] && [ "$JOB_ID" != "null" ]; then
              echo "Đã tạo Job kiểm tra: $JOB_ID"
              while true; do
                STATUS=$(oci resource-manager job get --job-id "$JOB_ID" --query "data.\"lifecycle-state\"" --raw-output 2>/dev/null || true)
                if [ "$STATUS" = "SUCCEEDED" ]; then
                  echo "===================================================="
                  echo ">>> THÀNH CÔNG! Máy ảo đã được tạo hoàn tất. <<<"
                  echo "===================================================="
                  
                  # Gửi tin nhắn Telegram thông báo
                  MSG="🚀 *CHÚC MỪNG! Máy ảo Oracle Cloud ARM đã tạo thành công!*%0A%0A*Region:* ap-singapore-1%0A*Job ID:* \`$JOB_ID\`%0A*Thời gian:* $(date '+%Y-%m-%d %H:%M:%S')%0A%0A👉 Vào Oracle Console kiểm tra Public IP để dùng PuTTY!"
                  curl -s -X POST "https://api.telegram.org/bot${TELE_TOKEN}/sendMessage" \
                    -d "chat_id=${TELE_CHAT_ID}" \
                    -d "text=${MSG}" \
                    -d "parse_mode=Markdown"

                  # Vô hiệu hóa Workflow để tiết kiệm thời lượng GitHub Actions
                  gh workflow disable "oracle_sniper.yml" --repo "${{ github.repository }}" || true
                  exit 0
                elif [ "$STATUS" = "FAILED" ]; then
                  echo "Cụm Singapore vẫn hết chỗ (Out of capacity). Thử lại sau 60s..."
                  break
                fi
                sleep 10
              done
            else
              echo "Lỗi gửi lệnh. Thử lại sau 60s..."
            fi
            sleep 60
          done
