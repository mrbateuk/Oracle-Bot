name: Oracle A1 Always Free - SDK V2

on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'check = no creation, launch = one create request'
        type: choice
        required: true
        default: check
        options: [check, launch]

permissions:
  contents: read
  actions: write

concurrency:
  group: oracle-a1-single-instance
  cancel-in-progress: false

jobs:
  a1:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
      OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
      OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
      OCI_REGION: ${{ secrets.OCI_REGION }}
      OCI_KEY_FILE_B64: ${{ secrets.OCI_KEY_FILE }}
      OCI_SUBNET_ID: ${{ secrets.OCI_SUBNET_ID }}
      OCI_SSH_PUBLIC_KEY: ${{ secrets.OCI_SSH_PUBLIC_KEY }}
      OCI_IMAGE_OCID: ${{ secrets.OCI_IMAGE_OCID }}
      OCI_COMPARTMENT_OCID: ${{ secrets.OCI_COMPARTMENT_OCID }}
      OCI_AVAILABILITY_DOMAIN: ${{ secrets.OCI_AVAILABILITY_DOMAIN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GH_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      HUNT_MODE: ${{ github.event_name == 'schedule' && 'launch' || inputs.mode }}
      A1_OCPUS: '2'
      A1_MEMORY_GB: '12'
      A1_DISPLAY_NAME: 'Oracle-ARM-Always-Free'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install OCI Python SDK
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/oci-sdk"
          "$RUNNER_TEMP/oci-sdk/bin/python" -m pip install --disable-pip-version-check --quiet 'oci==2.190.0'
          echo "SDK_PYTHON=$RUNNER_TEMP/oci-sdk/bin/python" >> "$GITHUB_ENV"

      - name: Configure OCI signing key
        shell: bash
        run: |
          set -euo pipefail
          for key in OCI_TENANCY_OCID OCI_USER_OCID OCI_FINGERPRINT OCI_REGION OCI_KEY_FILE_B64 OCI_SUBNET_ID; do
            if [[ -z "${!key:-}" ]]; then echo "Missing secret: $key" >&2; exit 1; fi
          done
          install -d -m 700 "$RUNNER_TEMP/oci-config"
          printf '%s' "$OCI_KEY_FILE_B64" | base64 --decode > "$RUNNER_TEMP/oci-config/api.pem"
          chmod 600 "$RUNNER_TEMP/oci-config/api.pem"
          openssl pkey -in "$RUNNER_TEMP/oci-config/api.pem" -noout > /dev/null
          {
            printf '[DEFAULT]\n'
            printf 'user=%s\n' "$OCI_USER_OCID"
            printf 'fingerprint=%s\n' "$OCI_FINGERPRINT"
            printf 'key_file=%s\n' "$RUNNER_TEMP/oci-config/api.pem"
            printf 'tenancy=%s\n' "$OCI_TENANCY_OCID"
            printf 'region=%s\n' "$OCI_REGION"
          } > "$RUNNER_TEMP/oci-config/config"
          chmod 600 "$RUNNER_TEMP/oci-config/config"
          echo "OCI_CONFIG_FILE=$RUNNER_TEMP/oci-config/config" >> "$GITHUB_ENV"

      - name: Check account / safely attempt A1 creation
        shell: bash
        run: |
          set -euo pipefail
          "$SDK_PYTHON" -u scripts/oci_hunt.py
