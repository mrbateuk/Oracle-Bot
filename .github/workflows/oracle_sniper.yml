- name: Run Stack Apply Job & Alert Telegram
        env:
          STACK_ID: ${{ secrets.OCI_STACK_ID }}
          TELE_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELE_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # 1. Kiểm tra xác thực ban đầu với Oracle
          echo "=== Kiểm tra cấu hình OCI CLI ==="
          oci os ns get || { echo "LỖI XÁC THỰC OCI! Kiểm tra lại Key/Fingerprint."; exit 1; }

          END_TIME=$((SECONDS + 1500))

          while [ $SECONDS -lt $END_TIME ]; do
            echo "--- [$(date '+%H:%M:%S')] Đang gửi yêu cầu tạo máy ảo ARM... ---"
            
            # Ghi phản hồi ra file tạm để bắt trọn mã lỗi
            oci resource-manager job create-apply-job \
              --stack-id "$STACK_ID" \
              --execution-plan-strategy AUTO_APPROVED \
              --output json > job_output.json 2> job_error.log || true

            JOB_ID=$(jq -r '.data.id // empty' job_output.json 2>/dev/null || true)

            if [ -n "$JOB_ID" ]; then
              echo "Đã tạo Job kiểm tra: $JOB_ID"
              while true; do
                STATUS=$(oci resource-manager job get --job-id "$JOB_ID" --query "data.\"lifecycle-state\"" --raw-output 2>/dev/null || true)
                if [ "$STATUS" = "SUCCEEDED" ]; then
                  echo "===================================================="
                  echo ">>> THÀNH CÔNG! Máy ảo đã được tạo hoàn tất. <<<"
                  echo "===================================================="
                  
                  MSG="🚀 *CHÚC MỪNG! Máy ảo Oracle Cloud ARM đã tạo thành công!*%0A%0A*Region:* ap-singapore-1%0A*Job ID:* \`$JOB_ID\`%0A*Thời gian:* $(date '+%Y-%m-%d %H:%M:%S')%0A%0A👉 Vào Oracle Console kiểm tra Public IP!"
                  curl -s -X POST "https://api.telegram.org/bot${TELE_TOKEN}/sendMessage" \
                    -d "chat_id=${TELE_CHAT_ID}" \
                    -d "text=${MSG}" \
                    -d "parse_mode=Markdown"

                  gh workflow disable "oracle_sniper.yml" --repo "${{ github.repository }}" || true
                  exit 0
                elif [ "$STATUS" = "FAILED" ]; then
                  echo "Cụm Singapore vẫn hết chỗ (Out of capacity). Thử lại sau 60s..."
                  break
                fi
                sleep 10
              done
            else
              echo ">>> CHI TIẾT LỖI TỪ ORACLE <<<"
              cat job_error.log
              cat job_output.json
              echo "------------------------------"
            fi
            sleep 60
          done
