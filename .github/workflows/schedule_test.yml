
name: Test GitHub Scheduler

on:
  schedule:
    - cron: '11,41 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  scheduler_test:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Verify schedule event
        run: |
          echo "Event: $GITHUB_EVENT_NAME"
          echo "Scheduler triggered successfully"
          date -u
